<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 3 - Pronouns</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
  }

  .author-box {
    position: absolute;
    top: 20px;
    right: 25px;
    background: #ffffff;
    color: #2c3e50;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 0.9rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 10;
  }

  .card {
    background: rgba(44, 62, 80, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    padding: 40px 35px;
    max-width: 750px;
    width: 100%;
    text-align: center;
  }

  h1 { font-size: 1.9rem; margin-bottom: 10px; }

  .subtitle { color: #bdc3c7; font-size: 1rem; margin-bottom: 25px; }

  .score-bar {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50px;
    padding: 12px 20px;
    display: flex;
    justify-content: space-around;
    margin-bottom: 25px;
    font-weight: bold;
    font-size: 1rem;
  }

  .score-bar span { display: flex; align-items: center; gap: 6px; }

  .btn-audio {
    background: #3498db;
    color: #ffffff;
    border: none;
    border-radius: 50px;
    padding: 16px 40px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    margin: 10px 5px;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
  }

  .btn-audio:hover {
    background: #2980b9;
    transform: translateY(-2px);
  }

  .badge {
    display: inline-block;
    background: rgba(52, 152, 219, 0.3);
    color: #85c1e9;
    font-size: 0.8rem;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
  }

  .prompt {
    font-size: 1.4rem;
    margin: 20px 0;
    line-height: 1.7;
    color: #ecf0f1;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .prompt .highlight {
    background: rgba(241, 196, 15, 0.3);
    padding: 2px 10px;
    border-radius: 6px;
    font-weight: bold;
    color: #f1c40f;
  }

  .prompt .instruction {
    font-size: 1rem;
    color: #bdc3c7;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }

  .option {
    background: #ffffff;
    color: #2c3e50;
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .option:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: #3498db;
    box-shadow: 0 6px 15px rgba(52, 152, 219, 0.3);
  }

  .option:disabled { cursor: not-allowed; }

  .option.correct {
    background: #d5f5e3;
    border-color: #27ae60;
    color: #1e8449;
  }

  .option.wrong {
    background: #fadbd8;
    border-color: #e74c3c;
    color: #922b21;
  }

  .progress { margin-top: 20px; color: #bdc3c7; font-size: 0.95rem; }
  .hidden { display: none; }

  .final-screen h2 { font-size: 2rem; margin-bottom: 15px; }
  .final-screen p { font-size: 1.2rem; margin: 8px 0; color: #ecf0f1; }

  @media (max-width: 500px) {
    .card { padding: 25px 18px; }
    h1 { font-size: 1.4rem; }
    .option { font-size: 0.95rem; padding: 12px 10px; }
    .btn-audio { font-size: 1rem; padding: 14px 28px; }
    .options { grid-template-columns: 1fr; }
    .prompt { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="author-box">FPB with AI</div>

<div class="card">
  <!-- PANTALLA DE PREPARACIÓN -->
  <div id="intro-screen">
    <h1>Class 3: Pronouns</h1>
    <p class="subtitle">
      Read each sentence and choose the pronoun that replaces the <strong>person or thing</strong> mentioned.
    </p>
    <p class="subtitle" style="color:#f1c40f; font-weight:bold;">30 questions · No time limit</p>
    <button class="btn-audio" id="btn-start" style="background:#27ae60;">▶ Start Game</button>
  </div>

  <!-- PANTALLA DE JUEGO -->
  <div id="game-screen" class="hidden">
    <div class="score-bar">
      <span>📝 <span id="q-counter">1 / 30</span></span>
      <span>✅ <span id="score-correct">0</span></span>
      <span>❌ <span id="score-wrong">0</span></span>
    </div>

    <div id="badge-container"><span class="badge">📖 Replace with a Pronoun</span></div>
    <div class="prompt" id="prompt"></div>

    <div class="options" id="options"></div>

    <p class="progress">Question <span id="q-current">1</span> of <span id="q-total">30</span></p>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="final-screen" class="hidden final-screen">
    <h2>🎉 Game Over!</h2>
    <p>✅ Correct: <span id="final-correct">0</span></p>
    <p>❌ Wrong: <span id="final-wrong">0</span></p>
    <p>📊 Score: <span id="final-percent">0</span>%</p>
    <button class="btn-audio" onclick="location.reload()" style="background:#27ae60; margin-top:20px;">🔁 Play Again</button>
  </div>
</div>

<script>
// ================== DATA ==================
// 30 oraciones simples. El estudiante lee y elige el pronombre
// que reemplaza al sujeto (nombre propio, grupo o lugar).
// Vocabulario: profesiones, lugares públicos, familia.

const QUESTIONS = [
  // ---------- PROFESIONES (10) ----------
  { sentence: "John is a dentist.",              highlight: "John",              correct: "He",   options: ["He", "She", "It", "They"] },
  { sentence: "Mary is a teacher.",              highlight: "Mary",              correct: "She",  options: ["She", "He", "It", "They"] },
  { sentence: "Peter is a doctor.",              highlight: "Peter",             correct: "He",   options: ["He", "She", "It", "We"] },
  { sentence: "Anna is a nurse.",                highlight: "Anna",              correct: "She",  options: ["She", "He", "It", "They"] },
  { sentence: "Luis is a chef.",                 highlight: "Luis",              correct: "He",   options: ["He", "She", "It", "You"] },
  { sentence: "Sofia is a lawyer.",              highlight: "Sofia",             correct: "She",  options: ["She", "He", "It", "They"] },
  { sentence: "Carlos is a pilot.",              highlight: "Carlos",            correct: "He",   options: ["He", "She", "It", "We"] },
  { sentence: "Laura is a dentist.",             highlight: "Laura",             correct: "She",  options: ["She", "He", "It", "They"] },
  { sentence: "David is a police officer.",      highlight: "David",             correct: "He",   options: ["He", "She", "It", "You"] },
  { sentence: "Elena is a firefighter.",         highlight: "Elena",             correct: "She",  options: ["She", "He", "It", "They"] },

  // ---------- LUGARES PÚBLICOS (10) ----------
  { sentence: "The hospital is very big.",       highlight: "The hospital",      correct: "It",   options: ["It", "He", "She", "They"] },
  { sentence: "Sara is in the park.",            highlight: "Sara",              correct: "She",  options: ["She", "He", "It", "They"] },
  { sentence: "The school is near my house.",    highlight: "The school",        correct: "It",   options: ["It", "He", "She", "We"] },
  { sentence: "The library is open today.",      highlight: "The library",       correct: "It",   options: ["It", "He", "She", "They"] },
  { sentence: "The restaurant is very clean.",   highlight: "The restaurant",    correct: "It",   options: ["It", "He", "She", "You"] },
  { sentence: "Tom is in the museum.",           highlight: "Tom",               correct: "He",   options: ["He", "She", "It", "They"] },
  { sentence: "The supermarket is closed.",      highlight: "The supermarket",   correct: "It",   options: ["It", "He", "She", "We"] },
  { sentence: "Maria is at the airport.",        highlight: "Maria",             correct: "She",  options: ["She", "He", "It", "They"] },
  { sentence: "The cinema is next to the bank.", highlight: "The cinema",        correct: "It",   options: ["It", "He", "She", "You"] },
  { sentence: "The bank is closed on Sundays.",  highlight: "The bank",          correct: "It",   options: ["It", "He", "She", "They"] },

  // ---------- FAMILIA (10) ----------
  { sentence: "My mother is a nurse.",           highlight: "My mother",         correct: "She",  options: ["She", "He", "It", "They"] },
  { sentence: "My father is an engineer.",       highlight: "My father",         correct: "He",   options: ["He", "She", "It", "We"] },
  { sentence: "Juan and Pedro are brothers.",    highlight: "Juan and Pedro",    correct: "They", options: ["They", "We", "He", "She"] },
  { sentence: "My sister is a student.",         highlight: "My sister",         correct: "She",  options: ["She", "He", "It", "You"] },
  { sentence: "My grandparents live in Mexico.", highlight: "My grandparents",   correct: "They", options: ["They", "We", "He", "She"] },
  { sentence: "My uncle is a musician.",         highlight: "My uncle",          correct: "He",   options: ["He", "She", "It", "They"] },
  { sentence: "My aunt is a doctor.",            highlight: "My aunt",           correct: "She",  options: ["She", "He", "It", "We"] },
  { sentence: "Daniel and I are in the school.", highlight: "Daniel and I",      correct: "We",   options: ["We", "They", "You", "He"] },
  { sentence: "My baby brother is sleeping.",    highlight: "My baby brother",   correct: "He",   options: ["He", "She", "It", "They"] },
  { sentence: "My grandmother makes cakes.",     highlight: "My grandmother",    correct: "She",  options: ["She", "He", "It", "You"] }
];

// ================== STATE ==================
let questions = [];
let currentQuestion = 0;
let correctCount = 0;
let wrongCount = 0;
let locked = false;

// ================== SHUFFLE ==================
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ================== GAME FLOW ==================
function startGame() {
  questions = shuffleArray(QUESTIONS);

  document.getElementById('intro-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('q-total').textContent = questions.length;
  loadQuestion();
}

function loadQuestion() {
  locked = false;
  const q = questions[currentQuestion];

  document.getElementById('q-current').textContent = currentQuestion + 1;
  document.getElementById('q-counter').textContent = `${currentQuestion + 1} / ${questions.length}`;

  const parts = q.sentence.split(q.highlight);
  const promptEl = document.getElementById('prompt');
  promptEl.innerHTML = `<span class="instruction">Choose the pronoun that replaces the highlighted word:</span>${parts[0]}<span class="highlight">${q.highlight}</span>${parts[1] || ''}`;

  const options = shuffleArray(q.options);
  const container = document.getElementById('options');
  container.innerHTML = '';

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => checkAnswer(btn, opt, q.correct));
    container.appendChild(btn);
  });
}

function checkAnswer(btn, selected, correct) {
  if (locked) return;
  locked = true;

  const allButtons = document.querySelectorAll('.option');
  allButtons.forEach(b => b.disabled = true);

  if (selected === correct) {
    btn.classList.add('correct');
    correctCount++;
    document.getElementById('score-correct').textContent = correctCount;
    setTimeout(nextQuestion, 1000);
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    document.getElementById('score-wrong').textContent = wrongCount;
    allButtons.forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });
    setTimeout(nextQuestion, 1500);
  }
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) {
    endGame();
  } else {
    loadQuestion();
  }
}

function endGame() {
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('final-screen').classList.remove('hidden');
  document.getElementById('final-correct').textContent = correctCount;
  document.getElementById('final-wrong').textContent = wrongCount;
  const percent = Math.round((correctCount / questions.length) * 100);
  document.getElementById('final-percent').textContent = percent;
}

// ================== EVENTS ==================
document.getElementById('btn-start').addEventListener('click', startGame);
</script>

</body>
</html>
